services:
  analise:
    build: .
    image: analise-provas
    volumes:
      - ./data:/app/data      # coloque aqui o CSV dos microdados do ENEM
      - ./saida:/app/saida    # resultados (itens.csv, prova.json)

  testes:
    image: analise-provas
    build: .
    entrypoint: ["python", "-m", "pytest", "-v"]
    command: []

  app:
    image: analise-provas
    build: .
    entrypoint: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501",
                 "--server.headless=true", "--browser.gatherUsageStats=false"]
    command: []
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  lint:
    image: analise-provas
    build: .
    volumes:
      - .:/app                # lê o código do disco, não da imagem: não precisa de build a cada mudança
    entrypoint: ["sh", "-c", "ruff check . && ruff format --check ."]
    command: []
